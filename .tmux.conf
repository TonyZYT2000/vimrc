set -g mouse on
set -g mode-keys vi
setw -g mode-keys vi
set -g status-keys vi
set -g set-clipboard on

set -g default-shell /bin/zsh
set -g default-terminal "xterm-256color"

# copy selection to system clipboard with Enter in copy-mode (X11)
bind-key -T copy-mode    Enter send -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel "xclip -in -selection clipboard"

# mouse: copy to system clipboard when selection ends
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind-key -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -in -selection clipboard"

